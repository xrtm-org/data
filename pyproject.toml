[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xrtm-data"
version = "0.1.0"
description = "The Snapshot Vault for XRTM."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "aiohttp>=3.9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = {find = {where = ["src"], include = ["xrtm*"], namespaces = true}}
